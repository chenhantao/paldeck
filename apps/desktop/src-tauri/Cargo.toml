[package]
name = "paldeck"
version = "0.1.0"
description = "A secure desktop manager for Palworld dedicated servers"
authors = ["Paldeck Contributors"]
edition = "2021"

[lib]
name = "paldeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "time"] }
