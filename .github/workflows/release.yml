name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify tag, branch, versions, and changelog
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Release tag must use SemVer, for example v0.1.0.\n' >&2
            exit 1
          fi

          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            printf 'Release tag must point to a commit reachable from master.\n' >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          lock_desktop_version="$(node -p "require('./package-lock.json').packages['apps/desktop'].version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)"

          for declared_version in \
            "${root_version}" \
            "${desktop_version}" \
            "${lock_root_version}" \
            "${lock_desktop_version}" \
            "${tauri_version}" \
            "${cargo_version}"; do
            if [ "${declared_version}" != "${version}" ]; then
              printf 'Tag version %s does not match declared version %s.\n' \
                "${version}" "${declared_version}" >&2
              exit 1
            fi
          done

          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            printf 'CHANGELOG.md must contain a ## [%s] release section.\n' \
              "${version}" >&2
            exit 1
          fi

  windows:
    name: Windows x64
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run tauri --workspace @paldeck/desktop -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Smoke-test Windows application
        shell: pwsh
        run: |
          $executable = (Resolve-Path "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/paldeck.exe").Path
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($executable)
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.Environment["PALDECK_INTERNAL_SSH_ASKPASS"] = "1"
          $startInfo.Environment["PALDECK_INTERNAL_SSH_PASSPHRASE"] = "paldeck-ci-passphrase"
          $askpass = [System.Diagnostics.Process]::Start($startInfo)
          $askpassOutput = $askpass.StandardOutput.ReadToEnd().TrimEnd()
          $askpass.WaitForExit()
          if ($askpass.ExitCode -ne 0 -or $askpassOutput -ne "paldeck-ci-passphrase") {
            throw "Paldeck SSH askpass entry point failed."
          }
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Paldeck exited during startup with code $($process.ExitCode)."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "paldeck-windows-x64-release"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $target = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release"
          $portable = Join-Path $output "Paldeck-$env:GITHUB_REF_NAME-windows-x64-portable-preview.zip"
          Compress-Archive -Path "$target/paldeck.exe" -DestinationPath $portable

          $installers = @(Get-ChildItem "$target/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = Join-Path $output "Paldeck-$env:GITHUB_REF_NAME-windows-x64-setup.exe"
          Copy-Item $installers[0].FullName -Destination $installer

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: Paldeck-windows-x64-release
          path: ${{ runner.temp }}/paldeck-windows-x64-release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build macOS application
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >
          npm run tauri --workspace @paldeck/desktop -- build
          --target aarch64-apple-darwin --bundles app

      - name: Verify macOS bundle
        run: |
          set -eu
          app="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Paldeck.app"
          executable="${app}/Contents/MacOS/paldeck"
          codesign --verify --deep --strict --verbose=2 "${app}"

          unexpected="$(otool -L "${executable}" | awk 'NR > 1 { print $1 }' | grep -Ev '^(/System/Library/|/usr/lib/|@rpath/|@loader_path/|@executable_path/)' || true)"
          if [ -n "${unexpected}" ]; then
            printf 'Unexpected non-system dynamic dependencies:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Smoke-test macOS application
        run: |
          set -eu
          executable="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Paldeck.app/Contents/MacOS/paldeck"
          askpass_output="$(PALDECK_INTERNAL_SSH_ASKPASS=1 PALDECK_INTERNAL_SSH_PASSPHRASE=paldeck-ci-passphrase "${executable}")"
          [ "${askpass_output}" = "paldeck-ci-passphrase" ]
          log_file="${RUNNER_TEMP}/paldeck-macos-smoke.log"
          "${executable}" >"${log_file}" 2>&1 &
          pid=$!
          cleanup() {
            kill "${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 5
          if ! kill -0 "${pid}" 2>/dev/null; then
            cat "${log_file}" >&2
            printf 'Paldeck exited during macOS startup.\n' >&2
            exit 1
          fi

      - name: Prepare macOS release asset
        run: |
          set -eu
          output="${RUNNER_TEMP}/paldeck-macos-arm64-release"
          mkdir -p "${output}"
          app="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Paldeck.app"
          archive="${output}/Paldeck-${GITHUB_REF_NAME}-macos-arm64-ad-hoc.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app}" "${archive}"

          verification_dir="$(mktemp -d "${RUNNER_TEMP}/paldeck-macos-verify.XXXXXX")"
          ditto -x -k "${archive}" "${verification_dir}"
          codesign --verify --deep --strict --verbose=2 "${verification_dir}/Paldeck.app"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v7
        with:
          name: Paldeck-macos-arm64-release
          path: ${{ runner.temp }}/paldeck-macos-arm64-release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Install dependencies
        run: npm ci

      - name: Build Linux application
        run: npm run tauri --workspace @paldeck/desktop -- build --bundles appimage,deb

      - name: Smoke-test Linux application
        run: |
          askpass_output="$(PALDECK_INTERNAL_SSH_ASKPASS=1 PALDECK_INTERNAL_SSH_PASSPHRASE=paldeck-ci-passphrase apps/desktop/src-tauri/target/release/paldeck)"
          [ "${askpass_output}" = "paldeck-ci-passphrase" ]
          set +e
          timeout 8s xvfb-run -a apps/desktop/src-tauri/target/release/paldeck \
            >"${RUNNER_TEMP}/paldeck-linux-smoke.log" 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 124 ]; then
            cat "${RUNNER_TEMP}/paldeck-linux-smoke.log" >&2
            printf 'Paldeck exited during Linux startup with code %s.\n' "${status}" >&2
            exit 1
          fi

      - name: Prepare Linux release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          output="${RUNNER_TEMP}/paldeck-linux-x64-release"
          mkdir -p "${output}"

          appimages=(apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          packages=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected exactly one AppImage and one Debian package.\n' >&2
            exit 1
          fi

          cp "${appimages[0]}" "${output}/Paldeck-${GITHUB_REF_NAME}-linux-x64.AppImage"
          cp "${packages[0]}" "${output}/Paldeck-${GITHUB_REF_NAME}-linux-x64.deb"
          chmod +x "${output}/Paldeck-${GITHUB_REF_NAME}-linux-x64.AppImage"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: Paldeck-linux-x64-release
          path: ${{ runner.temp }}/paldeck-linux-x64-release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft GitHub Release
    needs:
      - preflight
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: Paldeck-*-release
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and write checksums
        run: |
          set -euo pipefail
          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${asset_count}" -ne 5 ]; then
            printf 'Expected five release assets, found %s.\n' "${asset_count}" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(
            --repo "${GITHUB_REPOSITORY}"
            --draft
            --verify-tag
            --title "Paldeck ${GITHUB_REF_NAME}"
            --generate-notes
            --notes "Signing notice: the macOS asset uses an ad-hoc signature and is not notarized. Windows and Linux assets are unsigned. Review the downloaded assets before publishing this draft."
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          existing_draft="$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          if [ -z "${existing_draft}" ]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/* "${release_flags[@]}"
          elif [ "${existing_draft}" = "true" ]; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            printf 'Release %s is already published; refusing to replace its assets.\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
