name: 缺陷报告
description: 报告一个可复现的 Paldeck 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请使用仓库的私密安全报告功能，不要提交公开 Issue。

  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 此报告不包含密码、SSH 私钥、服务器地址或存档数据。
          required: true

  - type: dropdown
    attributes:
      label: 问题区域
      options:
        - Docker Compose
        - 桌面界面
        - SSH 连接
        - 配置管理
        - 备份
        - 其他
    validations:
      required: true

  - type: input
    attributes:
      label: Paldeck 版本
      placeholder: v0.1.0 或提交哈希
    validations:
      required: true

  - type: input
    attributes:
      label: 操作系统
      placeholder: macOS 15 arm64、Windows 11 x64、Ubuntu 24.04 amd64
    validations:
      required: true

  - type: textarea
    attributes:
      label: 问题描述
      description: 清楚说明实际发生了什么。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: 日志或截图
      description: 请先移除凭据、IP 地址、用户名和其他敏感信息。
